[package]
name = "scratcharch-pipeline"
version = "0.1.0"
edition = "2021"
description = "Unified compilation pipeline for ScratchArch"

[dependencies]
scratcharch-ir = { path = "../scratcharch-ir" }
scratcharch-llvm = { path = "../scratcharch-llvm" }
scratcharch-driver = { path = "../scratcharch-driver" }
scratcharch-scratchgraph = { path = "../scratcharch-scratchgraph" }
scratcharch-analyzer = { path = "../scratcharch-analyzer" }
scratcharch-explorer = { path = "../scratcharch-explorer" }
scratcharch-opt = { path = "../scratcharch-opt" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package]
name = "scratcharch-sb3"
version = "0.1.0"
edition = "2021"
description = "SB3 archive handling for ScratchArch"

[dependencies]
scratcharch-scratchgraph = { path = "../scratcharch-scratchgraph" }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md-5 = "0.10"

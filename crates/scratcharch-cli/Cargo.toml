[package]
name = "scratcharch-cli"
version = "0.1.0"
edition = "2021"
description = "ScratchArch developer toolchain CLI"

[[bin]]
name = "scratcharch"
path = "src/main.rs"

[dependencies]
scratcharch-driver = { path = "../scratcharch-driver" }
scratcharch-scratchgraph = { path = "../scratcharch-scratchgraph" }
scratcharch-analyzer = { path = "../scratcharch-analyzer" }
scratcharch-explorer = { path = "../scratcharch-explorer" }
scratcharch-ir = { path = "../scratcharch-ir" }
scratcharch-pipeline = { path = "../scratcharch-pipeline" }
scratcharch-sb3 = { path = "../scratcharch-sb3" }
scratcharch-transform = { path = "../scratcharch-transform" }
scratcharch-validation = { path = "../scratcharch-validation" }
scratcharch-compat = { path = "../scratcharch-compat" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
